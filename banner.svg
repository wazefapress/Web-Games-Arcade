<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 180" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="btnGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
  </defs>
  
  <!-- خلفية البانر -->
  <rect width="720" height="180" rx="12" fill="url(#bgGrad)" stroke="#334155" stroke-width="2"/>
  
  <!-- أيقونة البرق / الترويج -->
  <text x="45" y="108" font-size="52">⚡</text>
  
  <!-- النصوص الترويجية -->
  <text x="125" y="75" fill="#ffffff" font-family="Tahoma, Arial, sans-serif" font-weight="bold" font-size="26">استمتع باللعبة؟</text>
  <text x="125" y="118" fill="#94a3b8" font-family="Tahoma, Arial, sans-serif" font-size="18">ادعم استمرارها وتطويرها بمساهمتك البسيطة!</text>
  
  <!-- زر التفاعل "دعم الآن" -->
  <g transform="translate(520, 55)">
    <rect width="165" height="70" rx="35" fill="url(#btnGrad)"/>
    <text x="82.5" y="42" fill="#ffffff" font-family="Tahoma, Arial, sans-serif" font-weight="bold" font-size="18" text-anchor="middle">دعم الآن 💛</text>
  </g>
</svg>
